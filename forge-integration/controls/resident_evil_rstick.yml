# Optional EKA2L1 keybind profile with Full Dual-Stick support (RE4 HD style)
# for Resident Evil: Degeneration (N-Gage 2.0, Nokia 5320 RM-409)
#
# NOTE: Default profile remains `resident_evil.yml` (preserved unchanged).
# Intrinsic engine limitation (verified in Resident_Evil.s3e PlayerControls & ENGLISH.dat):
#   The original game uses classic RE4/N-Gage tank controls with only 4 directional slots
#   (16=Up, 17=Down, 14=Left, 15=Right) and no separate strafe or "Aim Up/Aim Down" actions.
#   - Full 4-way Left Stick (303/302/301/300 -> 16/17/14/15) allows complete walking, turning,
#     and Left/Right navigation in inventory/map menus without losing horizontal input.
#   - Right Stick (307/306/305/304 -> 16/17/14/15) simultaneously provides horizontal camera/turn
#     rotation and 4-way laser-sight / sniper aiming.
#   - Gamepad Select/Back (button_id: 6) is reserved for the launcher's in-game Select Menu.
#
# Dual-Stick Full layout (SDL2 controller_id: 0):
#   - Left Stick Full 4-Way  (303/302/301/300) -> Move, Turn & Full 4-way Menu Navigation (16/17/14/15)
#   - Right Stick Full 4-Way (307/306/305/304) -> Turn Left/Right & 4-way Laser/Sniper Aim (16/17/14/15)
#   - Right Stick Click R3   (311)             -> Keypad '3' (51), assignable to 'Use knife/Zoom'
#   - Left Stick Click L3    (310)             -> N-Gage 'A' (180), Reload weapon
